services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: float-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: float
      POSTGRES_USER: float
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - float_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U float -d float"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  float_postgres_data: